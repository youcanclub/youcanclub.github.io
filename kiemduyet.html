<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Duyệt Kịch Bản | You Can Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070b14;
            --accent: #6ad2ff;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(51, 65, 85, 0.5);
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Lora', serif;
            color: #cbd5e1;
            background-image: radial-gradient(circle at 50% 0%, rgba(106, 210, 255, 0.1), transparent 50%);
        }
        .font-title { font-family: 'Playfair Display', serif; }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .loading-spinner {
            border: 3px solid rgba(106, 210, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4 sm:px-6">

    <header class="text-center mb-10 w-full max-w-3xl">
        <div class="inline-block relative mb-4">
            <img src="https://youcanclub.github.io/logoclbyoucan.jpg" alt="Logo" class="w-20 h-20 object-cover rounded-full border-2 border-[var(--accent)] p-1 bg-[#070b14] shadow-[0_0_15px_rgba(106,210,255,0.3)]">
        </div>
        <h1 class="text-3xl md:text-4xl font-title font-bold text-white mb-2">Trợ lý AI Kiểm duyệt</h1>
        <p class="text-slate-400 text-sm md:text-base">Dán kịch bản của bạn vào đây để AI phân tích theo 5 tiêu chí của CLB.</p>
    </header>

    <main class="w-full max-w-3xl glass-card rounded-2xl p-6 md:p-8 relative overflow-hidden">
        <div id="input-section">
            <div class="mb-4">
                <label for="topic-input" class="block text-white font-bold font-title tracking-wide mb-2">Chủ đề bài nói:</label>
                <input type="text" id="topic-input" placeholder="Ví dụ: Tầm quan trọng của việc tự học..." 
                    class="w-full bg-slate-900/80 border border-slate-700 text-slate-200 rounded-xl p-3 focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition-all shadow-inner">
            </div>

            <div class="flex justify-between items-end mb-2">
                <label for="script-input" class="text-white font-bold font-title tracking-wide">Nội dung kịch bản / Dàn ý:</label>
                <span id="char-count" class="text-xs text-slate-500">0 / 5000 ký tự</span>
            </div>
            
            <textarea id="script-input" rows="8" placeholder="Xin chào mọi người, hôm nay mình muốn chia sẻ về..." 
                class="w-full bg-slate-900/80 border border-slate-700 text-slate-200 rounded-xl p-4 focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition-all resize-y shadow-inner"></textarea>
            
            <div class="mt-6 text-center">
                <button id="btn-submit" onclick="reviewScript()" class="bg-[var(--accent)] text-slate-900 font-bold font-title text-lg px-8 py-3 rounded-full hover:scale-105 transition-transform shadow-[0_0_15px_rgba(106,210,255,0.4)] flex items-center justify-center gap-2 mx-auto cursor-pointer">
                    <span>Phân tích Kịch bản</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </button>
            </div>
        </div>

        <div id="loading-section" class="hidden flex-col items-center justify-center py-10">
            <div class="loading-spinner mb-4"></div>
            <p class="text-[var(--accent)] font-medium animate-pulse">Trợ lý AI đang đối chiếu với 5 tiêu chí của CLB...</p>
        </div>

        <div id="output-section" class="hidden mt-6 border-t border-slate-700/50 pt-6">
            <h3 class="text-xl font-title font-bold text-[var(--accent)] mb-4 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Kết quả kiểm duyệt
            </h3>
            
            <div id="ai-response" class="bg-slate-900/50 border border-slate-700 rounded-xl p-5 text-slate-300 text-sm md:text-base leading-relaxed whitespace-pre-wrap h-auto max-h-[400px] overflow-y-auto mb-6 shadow-inner">
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="resetForm()" class="px-6 py-2.5 rounded-full border border-slate-600 text-slate-300 hover:bg-slate-800 transition-colors font-medium text-sm cursor-pointer">
                    Sửa lại kịch bản
                </button>
                <a href="https://forms.gle/8f8Y9xqN1WWTqfUi9" target="_blank" class="px-6 py-2.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 transition-colors font-bold font-title text-center flex items-center justify-center gap-2 shadow-[0_0_10px_rgba(16,185,129,0.1)]">
                    Nộp biểu mẫu chính thức
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>
        </div>
    </main>

    <script>
        // =========================================================================
        // QUAN TRỌNG: DÁN API KEY CHUẨN CỦA GOOGLE (BẮT ĐẦU BẰNG AIza...) VÀO ĐÂY
        // Lấy key tại: https://aistudio.google.com/app/apikey
        // =========================================================================
        const GEMINI_API_KEY = "AQ.Ab8RN6KvV0ytiyPfFbwpybj5Qdts92yOwY5zD4vFJRBR7gd1HA";

        const SYSTEM_PROMPT = `Bạn là một Giám khảo và Cố vấn chuyên môn của You Can Club - CLB Thuyết trình và Tranh biện dành cho học sinh THPT. Nhiệm vụ của bạn là kiểm duyệt kịch bản để đảm bảo phù hợp với môi trường học đường.

QUAN TRỌNG NHẤT (PHẢI TUÂN THỦ TUYỆT ĐỐI):
1. TUYỆT ĐỐI KHÔNG chào hỏi, không dạo đầu dài dòng (KHÔNG dùng "Chào bạn", "Chào mừng bạn đến với...").
2. MỞ ĐẦU BÀI PHÂN TÍCH BẰNG ĐÚNG 1 CÂU SAU ĐÂY (IN NGHIÊNG): "*Lưu ý: Kết quả kiểm duyệt sau đây chỉ mang tính chất tham khảo, Ban Nội dung mới là người duyệt nội dung cuối cùng.*"
3. Ngay sau câu lưu ý trên, đi thẳng vào cấu trúc 5 phần kiểm duyệt.
4. BẮT BUỘC trả lời 100% BẰNG TIẾNG VIỆT, xưng "mình" và gọi "bạn", giọng điệu thân thiện, góp ý chân thành.

Dưới đây là 5 tiêu chí kiểm duyệt của CLB:
1. Chuẩn mực học đường: Không bạo lực, không tệ nạn, không chứa nội dung 18+.
2. Giá trị thông điệp: Mang ý nghĩa tích cực, truyền cảm hứng hoặc cung cấp kiến thức/góc nhìn hữu ích cho học sinh cấp 3.
3. Tôn trọng & Khách quan: Không công kích cá nhân, không thù ghét, không vi phạm các vấn đề nhạy cảm.
4. Ngôn từ văn minh: Lịch sự, không thô tục, không lạm dụng tiếng lóng phản cảm.
5. Cấu trúc logic & Thời lượng: Dàn ý/kịch bản rõ ràng, lập luận chặt chẽ. Kịch bản không được vượt quá 5 phút (khoảng 600 - 750 chữ).

Hãy phân tích bài làm của tôi BẰNG TIẾNG VIỆT theo đúng cấu trúc 5 phần sau (trình bày rõ ràng, xuống dòng dễ đọc):
1. Đánh giá Mức độ phù hợp (Ghi rõ và phân tích ngắn gọn từng tiêu chí từ 1 đến 5 là: Đạt / Không Đạt / Cần xem xét lại).
2. Điểm sáng của kịch bản (Khen ngợi 1-2 điểm tốt để động viên).
3. Vấn đề cần khắc phục (Góp ý nhẹ nhàng những chỗ chưa ổn, hoặc nhắc nhở nếu bài quá dài/quá ngắn).
4. Kết luận kiểm duyệt: [Đủ điều kiện / Cần chỉnh sửa / Từ chối].
5. Gợi ý nâng cấp (2-3 gợi ý cụ thể để làm bài nói sâu sắc, thu hút và tương tác tốt hơn với khán giả).

LƯU Ý ĐẶC BIỆT: Viết thật chi tiết, đầy đủ 5 phần, không bỏ dở câu trả lời giữa chừng.

Dưới đây là bài làm của tôi:\n`;

        const topicInput = document.getElementById('topic-input');
        const scriptInput = document.getElementById('script-input');
        const charCountEl = document.getElementById('char-count');
        const btnSubmit = document.getElementById('btn-submit');
        const inputSection = document.getElementById('input-section');
        const loadingSection = document.getElementById('loading-section');
        const outputSection = document.getElementById('output-section');
        const responseEl = document.getElementById('ai-response');

        scriptInput.addEventListener('input', () => {
            const length = scriptInput.value.length;
            charCountEl.innerText = `${length} / 5000 ký tự`;
            if(length > 5000) {
                charCountEl.classList.add('text-red-400');
            } else {
                charCountEl.classList.remove('text-red-400');
            }
        });

        async function reviewScript() {
            const topic = topicInput.value.trim();
            const script = scriptInput.value.trim();
            
            if (!topic) {
                const originalText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<span class="text-amber-300">Vui lòng nhập Chủ đề!</span>';
                setTimeout(() => { btnSubmit.innerHTML = originalText; }, 2000);
                topicInput.focus();
                return;
            }
            if (!script) {
                const originalText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<span class="text-amber-300">Vui lòng nhập Kịch bản!</span>';
                setTimeout(() => { btnSubmit.innerHTML = originalText; }, 2000);
                scriptInput.focus();
                return;
            }
            if (script.length > 5000) {
                const originalText = btnSubmit.innerHTML;
                btnSubmit.innerHTML = '<span class="text-amber-300">Kịch bản quá 5000 ký tự!</span>';
                setTimeout(() => { btnSubmit.innerHTML = originalText; }, 2000);
                return;
            }

            btnSubmit.disabled = true;
            inputSection.classList.add('hidden');
            outputSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            loadingSection.classList.add('flex');

            const finalPrompt = `${SYSTEM_PROMPT}- Chủ đề: ${topic}\n- Kịch bản/Dàn ý: ${script}`;

            try {
                // Đã sửa lại URL gọi API thành chuẩn dùng cho mô hình gemini-3.6-flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: finalPrompt }] }],
                        generationConfig: {
                            temperature: 0.6,
                            maxOutputTokens: 4096,
                        }
                    })
                });

                const data = await response.json();
                
                if(data.error) {
                    throw new Error(data.error.message);
                }

                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white">$1</strong>');

                responseEl.innerHTML = rawText;
                
                loadingSection.classList.add('hidden');
                loadingSection.classList.remove('flex');
                outputSection.classList.remove('hidden');

            } catch (error) {
                console.error("API Error: ", error);
                
                // Ẩn spinner loading
                loadingSection.classList.add('hidden');
                loadingSection.classList.remove('flex');
                
                // Ẩn luôn phần form nhập để người dùng tập trung vào xem lỗi
                inputSection.classList.add('hidden'); 
                
                // QUAN TRỌNG: Hiện phần kết quả ra để show lỗi thay vì giấu đi!
                outputSection.classList.remove('hidden');
                
                // In lỗi chi tiết ra màn hình
                responseEl.innerHTML = `
                    <div class="text-red-400 font-bold text-lg mb-2">⚠️ Lỗi kết nối AI:</div>
                    <div class="text-slate-300 font-mono text-sm bg-slate-800/50 p-4 rounded-xl border border-red-500/30 leading-relaxed">${error.message}</div>
                    <div class="mt-5 text-slate-400 text-sm bg-blue-900/10 p-4 rounded-xl border border-blue-500/20">
                        <strong class="text-[var(--accent)] block mb-1">Gợi ý khắc phục:</strong>
                        1. Nếu bạn vừa tải file này lên GitHub, hãy chờ khoảng 2-3 phút để GitHub cập nhật.<br>
                        2. Nhấn tổ hợp phím <strong class="text-white">Ctrl + F5</strong> (hoặc xóa bộ nhớ đệm Cache trình duyệt) để tải lại code mới nhất.<br>
                        3. Đảm bảo API Key của bạn không có khoảng trắng thừa.
                    </div>
                `;
            }
        }

        function resetForm() {
            outputSection.classList.add('hidden');
            loadingSection.classList.add('hidden');
            loadingSection.classList.remove('flex');
            inputSection.classList.remove('hidden');
            btnSubmit.disabled = false;
            topicInput.focus();
        }
    </script>
</body>
</html>
