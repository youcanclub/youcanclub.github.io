<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Duyệt Kịch Bản | You Can Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070b14;
            --accent: #6ad2ff;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(51, 65, 85, 0.5);
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Lora', serif;
            color: #cbd5e1;
            background-image: radial-gradient(circle at 50% 0%, rgba(106, 210, 255, 0.1), transparent 50%);
            min-height: 100vh;
        }
        .font-title { font-family: 'Playfair Display', serif; }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        .loading-spinner {
            border: 3px solid rgba(106, 210, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-col items-center py-12 px-4 sm:px-6">

    <header class="text-center mb-10 w-full max-w-3xl relative z-10">
        <div class="inline-block relative mb-4 group">
            <div class="absolute inset-0 bg-[var(--accent)] rounded-full blur opacity-40 group-hover:opacity-60 transition-opacity"></div>
            <img src="https://youcanclub.github.io/logoclbyoucan.jpg" alt="Logo" class="w-20 h-20 object-cover rounded-full border-2 border-[var(--accent)] p-1 bg-[#070b14] relative z-10" onerror="this.src='https://placehold.co/150x150/070b14/6ad2ff?text=YCC'">
        </div>
        <h1 class="text-3xl md:text-4xl font-title font-bold text-white mb-2">Trợ lý AI Kiểm duyệt</h1>
        <p class="text-slate-400 text-sm md:text-base">Công cụ hỗ trợ rà soát kịch bản theo chuẩn mực của You Can Club.</p>
    </header>

    <main class="w-full max-w-3xl glass-card rounded-2xl p-6 md:p-8 relative overflow-hidden z-10">
        
        <!-- Màn hình Input -->
        <div id="input-section">
            <div class="mb-5">
                <label class="text-white font-bold font-title tracking-wide block mb-2">Chủ đề bài nói:</label>
                <input type="text" id="topic-input" placeholder="Ví dụ: Áp lực đồng trang lứa..." 
                    class="w-full bg-slate-900/80 border border-slate-700 text-slate-200 rounded-xl p-3 focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition-all">
            </div>

            <div class="mb-2 flex justify-between items-end">
                <label class="text-white font-bold font-title tracking-wide">Nội dung kịch bản/dàn ý:</label>
                <span id="char-count" class="text-xs text-slate-500">0 / 5000 ký tự</span>
            </div>
            
            <textarea id="script-input" rows="8" placeholder="Xin chào mọi người, hôm nay mình muốn chia sẻ về..." 
                class="w-full bg-slate-900/80 border border-slate-700 text-slate-200 rounded-xl p-4 focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition-all resize-y shadow-inner"></textarea>
            
            <div class="mt-6 text-center">
                <button id="btn-submit" onclick="reviewScript()" class="bg-[var(--accent)] text-slate-900 font-bold font-title text-lg px-8 py-3 rounded-full hover:scale-105 transition-transform shadow-[0_0_15px_rgba(106,210,255,0.4)] inline-flex items-center gap-2 cursor-pointer">
                    <span>Phân tích Kịch bản</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </button>
            </div>
        </div>

        <!-- Màn hình Loading -->
        <div id="loading-section" class="hidden flex-col items-center justify-center py-12">
            <div class="loading-spinner mb-5"></div>
            <p class="text-[var(--accent)] font-medium animate-pulse text-lg">Đang phân tích kịch bản...</p>
            <p class="text-slate-400 text-sm mt-2">Quá trình này có thể mất khoảng 5 - 10 giây</p>
        </div>

        <!-- Màn hình Báo Lỗi -->
        <div id="error-section" class="hidden bg-red-500/10 border border-red-500/50 rounded-xl p-6 text-center">
            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center text-red-500 mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-red-400 font-bold text-xl font-title mb-2">Đã xảy ra lỗi!</h3>
            <p id="error-message" class="text-slate-300 text-sm mb-6 break-words bg-slate-900/50 p-3 rounded-lg"></p>
            <button onclick="resetForm()" class="px-6 py-2.5 rounded-full bg-slate-800 text-slate-300 border border-slate-600 hover:bg-slate-700 transition-colors font-medium cursor-pointer">Quay lại</button>
        </div>

        <!-- Màn hình Kết quả -->
        <div id="output-section" class="hidden mt-4">
            <h3 class="text-xl md:text-2xl font-title font-bold text-[var(--accent)] mb-4 flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Kết quả kiểm duyệt
            </h3>
            
            <!-- Đã loại bỏ whitespace-pre-wrap tại đây -->
            <div id="ai-response" class="bg-slate-900/60 border border-slate-700 rounded-xl p-5 md:p-6 text-slate-300 text-base leading-relaxed mb-6 shadow-inner">
                <!-- Nội dung AI sẽ đổ vào đây -->
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4 border-t border-slate-700/50 pt-6">
                <button onclick="resetForm()" class="px-6 py-3 rounded-full border border-slate-600 text-slate-300 hover:bg-slate-800 transition-colors font-medium text-sm cursor-pointer">
                    Sửa lại kịch bản
                </button>
                <a href="https://forms.gle/8f8Y9xqN1WWTqfUi9" target="_blank" class="px-6 py-3 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 hover:bg-emerald-500/20 transition-colors font-bold font-title text-center flex items-center justify-center gap-2">
                    Nộp biểu mẫu chính thức
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>
        </div>
    </main>

    <script>
    const WORKER_URL = "https://youcanclub-gemini-proxy.clbyoucan.workers.dev/";

    // --- (NẾU PROMPT NẰM Ở GIAO DIỆN) CẬP NHẬT LẠI SYSTEM_PROMPT ---
    // Chú ý: Đã đổi số thứ tự phần "Cấu trúc sau" thành số La Mã (I, II, III, IV, V)
    const SYSTEM_PROMPT = `BẮT BUỘC:
1. TRẢ LỜI 100% BẰNG TIẾNG VIỆT. KHÔNG DÙNG TIẾNG ANH. KHÔNG ĐẾM TỪ BẰNG TIẾNG ANH.
2. Xưng hô "mình" và gọi người dùng là "bạn". 
3. KHÔNG chào hỏi vòng vo.
4. Dòng đầu tiên luôn luôn bắt đầu bằng: "*Lưu ý: Kết quả kiểm duyệt sau đây chỉ mang tính chất tham khảo. Bạn vẫn có thể nộp biểu mẫu bình thường và Ban Nội dung sẽ là người duyệt bài chính thức.*"

Nhiệm vụ: Kiểm duyệt kịch bản dựa trên 5 tiêu chí:
1. Chuẩn mực học đường: Không bạo lực, 18+, tệ nạn.
2. Giá trị thông điệp: Tích cực, hữu ích cho cấp 3.
3. Tôn trọng & Khách quan: Không công kích, thù ghét.
4. Ngôn từ văn minh: Lịch sự, không lóng phản cảm.
5. Cấu trúc logic & Thời lượng: Rõ ràng, hợp 5 phút.

Hãy đánh giá theo đúng cấu trúc sau (BẮT BUỘC DÙNG SỐ LA MÃ CHO TIÊU ĐỀ LỚN):
I. ĐÁNH GIÁ MỨC ĐỘ PHÙ HỢP (Từng tiêu chí đánh số 1-5, ghi: Đạt / Không Đạt / Cần xem xét lại)
II. ĐIỂM SÁNG CỦA KỊCH BẢN
III. VẤN ĐỀ CẦN KHẮC PHỤC
IV. KẾT LUẬN KIỂM DUYỆT: [Đủ điều kiện / Cần chỉnh sửa / Từ chối]
V. GỢI Ý NÂNG CẤP`;

    const inputTopic = document.getElementById("topic-input");
    const inputScript = document.getElementById("script-input");
    const charCountEl = document.getElementById("char-count");

    const inputSection = document.getElementById("input-section");
    const loadingSection = document.getElementById("loading-section");
    const errorSection = document.getElementById("error-section");
    const outputSection = document.getElementById("output-section");

    const responseEl = document.getElementById("ai-response");
    const errorMsgEl = document.getElementById("error-message");
    const submitButton = document.getElementById("btn-submit");

    inputScript.addEventListener("input", () => {
        const len = inputScript.value.length;
        charCountEl.innerText = `${len} / 5000 ký tự`;
        if (len > 5000) {
            charCountEl.classList.add("text-red-400");
        } else {
            charCountEl.classList.remove("text-red-400");
        }
    });

    function showValidationError(message) {
        errorMsgEl.innerText = message;
        inputSection.classList.add("hidden");
        loadingSection.classList.add("hidden");
        loadingSection.classList.remove("flex");
        outputSection.classList.add("hidden");
        errorSection.classList.remove("hidden");
    }

    function escapeHTML(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

   function formatAIResponse(text) {
    let lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
    let html = "";
    let inList = false;

    function closeList() {
        if (inList) {
            html += "</ul>";
            inList = false;
        }
    }

    // Kiểm tra một chuỗi có phải viết HOA toàn bộ không (bỏ qua số, dấu câu)
    // Dùng để nhận diện 5 tiêu đề lớn (luôn viết HOA theo system prompt)
    function isAllCapsTitle(str) {
        let letters = str.replace(/[^\p{L}]/gu, "");
        if (letters.length < 2) return false; // tránh nhận nhầm chuỗi quá ngắn
        return letters === letters.toUpperCase() && letters !== letters.toLowerCase();
    }

    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        if (!line) {
            closeList();
            continue;
        }

        if (/^-{3,}$/.test(line)) {
            closeList();
            continue;
        }

        // Tiêu đề ### / ## / #
        if (/^#{1,3}\s+/.test(line)) {
            closeList();
            let title = line.replace(/^#{1,3}\s+/, "");
            html += `<div class="mt-6 mb-3 first:mt-0"><h4 class="text-lg md:text-xl font-title font-bold text-[var(--accent)]">${formatInline(title)}</h4></div>`;
            continue;
        }

        // Bullet point (- * •)
        if (/^[-*•]\s+/.test(line)) {
            if (!inList) {
                html += `<ul class="space-y-2 my-3">`;
                inList = true;
            }
            let item = line.replace(/^[-*•]\s+/, "");
            html += `<li class="flex gap-2.5 items-start"><span class="inline-block w-1.5 h-1.5 rounded-full bg-[var(--accent)] mt-2.5 shrink-0"></span><span>${formatInline(item)}</span></li>`;
            continue;
        }

        // Danh sách số (1. 2. 3.)
        let numMatch = line.match(/^(\d+)\.\s+(.+)$/);
        if (numMatch) {
            closeList();
            let content = numMatch[2];

            if (isAllCapsTitle(content)) {
                // Tiêu đề lớn (1. ĐÁNH GIÁ MỨC ĐỘ PHÙ HỢP, 2. ĐIỂM SÁNG...)
                html += `<div class="mt-6 mb-3 first:mt-0 pb-2 border-b border-slate-700/50"><h4 class="text-lg md:text-xl font-title font-bold text-[var(--accent)] flex items-center gap-2"><span class="flex items-center justify-center w-7 h-7 rounded-full bg-[var(--accent)]/15 text-sm shrink-0">${numMatch[1]}</span>${formatInline(content)}</h4></div>`;
            } else {
                // Mục con đánh số bên trong một tiêu đề (Chuẩn mực học đường, Giá trị thông điệp...)
                html += `<div class="flex gap-3 mb-3 pl-2"><span class="font-bold text-[var(--accent)] min-w-[22px]">${numMatch[1]}.</span><span>${formatInline(content)}</span></div>`;
            }
            continue;
        }

        // Đoạn văn thông thường
        closeList();
        html += `<p class="mb-3">${formatInline(line)}</p>`;
    }

    closeList();
    return html;
}

    function formatInline(text) {
        let result = escapeHTML(text);
        result = result.replace(/\*\*(.*?)\*\*/g, '<strong class="text-white font-bold">$1</strong>');
        result = result.replace(/\*(.*?)\*/g, '<em class="text-slate-300">$1</em>');
        return result;
    }

    // --- HÀM FORMAT CẬP NHẬT: NHẬN DIỆN SỐ LA MÃ & IN ĐẬM TÊN TIÊU CHÍ ---
    function formatAIResponse(text) {
        let lines = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
        let html = "";
        let inList = false;

        function closeList() {
            if (inList) {
                html += "</div>";
                inList = false;
            }
        }

        // Kiểm tra xem chuỗi có phải là chữ viết hoa (cho phép có dấu câu)
        function isAllCaps(str) {
            let letters = str.replace(/[^\p{L}]/gu, "");
            if (letters.length < 2) return false;
            return letters === letters.toUpperCase() && letters !== letters.toLowerCase();
        }

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();

            if (!line) {
                closeList();
                continue;
            }

            if (/^-{3,}$/.test(line)) {
                closeList();
                continue;
            }

            // 1. Dòng Lưu ý
            if (line.includes("Lưu ý:")) {
                closeList();
                let noteText = formatInline(line.replace(/\*Lưu ý:\s*/, '').replace(/Lưu ý:\s*/, '').replace(/\*/g, ''));
                html += `
                <div class="bg-blue-900/20 border border-blue-500/30 p-4 rounded-xl text-blue-200 text-sm italic mb-8 flex items-start gap-3 shadow-[inset_0_0_20px_rgba(59,130,246,0.05)]">
                    <svg class="w-5 h-5 text-[var(--accent)] shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="leading-relaxed opacity-90">${noteText}</span>
                </div>`;
                continue;
            }

            // Tiêu đề Markdown ###
            if (/^#{1,3}\s+/.test(line)) {
                closeList();
                let title = line.replace(/^#{1,3}\s+/, "");
                html += `<div class="mt-8 mb-4 first:mt-0 pb-2 border-b border-slate-700/50"><h4 class="text-lg md:text-xl font-title font-bold text-[var(--accent)]">${formatInline(title)}</h4></div>`;
                continue;
            }

            // Bullet point
            if (/^[-*•]\s+/.test(line)) {
                if (!inList) {
                    html += `<div class="space-y-3 mb-6 mt-2 ml-1">`;
                    inList = true;
                }
                let item = line.replace(/^[-*•]\s+/, "");
                html += `
                <div class="flex items-start gap-3.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-[var(--accent)] mt-2.5 shrink-0 shadow-[0_0_8px_rgba(106,210,255,0.8)]"></span>
                    <span class="leading-relaxed flex-1 text-slate-300">${formatInline(item)}</span>
                </div>`;
                continue;
            }

            // 2. Tiêu đề lớn dùng số La Mã (VD: I. ĐÁNH GIÁ MỨC ĐỘ PHÙ HỢP)
            // Regex nhận diện số La Mã: I, II, III, IV, V, VI...
            let romanMatch = line.match(/^(IV|V?I{0,3})\.\s+(.+)$/i); 
            if (romanMatch && isAllCaps(romanMatch[2])) {
                closeList();
                let romanNum = romanMatch[1].toUpperCase();
                let titleContent = romanMatch[2];
                html += `
                <div class="mt-8 mb-5 first:mt-0 pb-2 border-b border-slate-700/50 flex items-center">
                    <span class="text-[var(--accent)] mr-3 font-title font-bold text-xl drop-shadow-sm">${romanNum}.</span>
                    <h4 class="text-lg md:text-xl font-title font-bold text-[var(--accent)] uppercase tracking-wider">${formatInline(titleContent)}</h4>
                </div>`;
                continue;
            }

            // 3. Danh sách 5 tiêu chí (1. Chuẩn mực học đường: Đạt...)
            let numMatch = line.match(/^(\d+)\.\s+(.+)$/);
            if (numMatch) {
                let num = numMatch[1];
                let content = numMatch[2];

                if (!inList) {
                    html += `<div class="space-y-4 mb-6 mt-2">`;
                    inList = true;
                }

                let formattedContent = formatInline(content);
                
                // In đậm tên tiêu chí (nằm trước dấu hai chấm)
                let colonIndex = formattedContent.indexOf(':');
                if (colonIndex !== -1) {
                    let criterionName = formattedContent.substring(0, colonIndex + 1);
                    let criterionDesc = formattedContent.substring(colonIndex + 1);
                    formattedContent = `<strong class="text-white">${criterionName}</strong>${criterionDesc}`;
                }

                // Tô màu Đạt/Không đạt
                formattedContent = formattedContent.replace(/(Đạt)(?=[.,\s]|$)/g, '<span class="text-emerald-400 font-bold bg-emerald-400/10 px-1.5 py-0.5 rounded border border-emerald-400/20 shadow-sm">Đạt</span>');
                formattedContent = formattedContent.replace(/(Không Đạt)(?=[.,\s]|$)/g, '<span class="text-rose-400 font-bold bg-rose-400/10 px-1.5 py-0.5 rounded border border-rose-400/20 shadow-sm">Không Đạt</span>');
                formattedContent = formattedContent.replace(/(Cần xem xét( lại)?)(?=[.,\s]|$)/g, '<span class="text-amber-400 font-bold bg-amber-400/10 px-1.5 py-0.5 rounded border border-amber-400/20 shadow-sm">Cần xem xét</span>');

                // Bỏ background/khung của số thứ tự, chỉ để text xanh sáng
                html += `
                <div class="flex items-start gap-2 group">
                    <span class="font-title font-bold text-[var(--accent)] min-w-[20px] pt-0.5 drop-shadow-sm">${num}.</span>
                    <span class="leading-relaxed flex-1 text-slate-300 block pt-0.5">${formattedContent}</span>
                </div>`;
                continue;
            }

            // Đoạn văn thông thường
            closeList();
            let pContent = formatInline(line);
            
            // Tự động tô màu Kết luận
            pContent = pContent.replace(/(Đủ điều kiện)(?=[.,\s]|$)/gi, '<span class="text-emerald-400 font-bold uppercase tracking-wider bg-emerald-400/10 px-2.5 py-1 rounded border border-emerald-400/30 inline-block shadow-sm">ĐỦ ĐIỀU KIỆN</span>');
            pContent = pContent.replace(/(Từ chối)(?=[.,\s]|$)/gi, '<span class="text-rose-400 font-bold uppercase tracking-wider bg-rose-400/10 px-2.5 py-1 rounded border border-rose-400/30 inline-block shadow-sm">TỪ CHỐI</span>');
            pContent = pContent.replace(/(Cần chỉnh sửa)(?=[.,\s]|$)/gi, '<span class="text-amber-400 font-bold uppercase tracking-wider bg-amber-400/10 px-2.5 py-1 rounded border border-amber-400/30 inline-block shadow-sm">CẦN CHỈNH SỬA</span>');

            html += `<p class="mb-4 leading-relaxed text-slate-300">${pContent}</p>`;
        }

        closeList();
        return html;
    }

    async function reviewScript() {
        const topic = inputTopic.value.trim();
        const text = inputScript.value.trim();

        if (!topic) {
            showValidationError("Vui lòng nhập Chủ đề bài nói!");
            return;
        }

        if (!text) {
            showValidationError("Vui lòng dán nội dung kịch bản!");
            return;
        }

        if (text.length > 5000) {
            showValidationError("Kịch bản dài quá 5000 ký tự, hãy thu gọn lại nhé!");
            return;
        }

        inputSection.classList.add("hidden");
        errorSection.classList.add("hidden");
        outputSection.classList.add("hidden");

        loadingSection.classList.remove("hidden");
        loadingSection.classList.add("flex");

        if (submitButton) {
            submitButton.disabled = true;
            submitButton.classList.add("opacity-60");
            submitButton.classList.remove("cursor-pointer");
        }

        try {
            const response = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ topic: topic, script: text })
            });

            let data;
            try {
                data = await response.json();
            } catch (jsonError) {
                throw new Error("Máy chủ trả về dữ liệu không hợp lệ.");
            }

            if (!response.ok || data.error) {
                throw new Error(data.error || `Máy chủ trả về lỗi HTTP ${response.status}.`);
            }

            if (!data.text || typeof data.text !== "string" || !data.text.trim()) {
                throw new Error("AI không trả về kết quả hợp lệ.");
            }

            responseEl.innerHTML = formatAIResponse(data.text);

            loadingSection.classList.add("hidden");
            loadingSection.classList.remove("flex");
            outputSection.classList.remove("hidden");

            setTimeout(() => {
                outputSection.scrollIntoView({ behavior: "smooth", block: "start" });
            }, 100);

        } catch (error) {
            console.error("AI Review Error:", error);

            loadingSection.classList.add("hidden");
            loadingSection.classList.remove("flex");

            errorMsgEl.innerText = "Mình chưa thể hoàn thành việc kiểm duyệt lần này.\n\n" + error.message + "\n\nBạn hãy thử lại sau một chút nhé.";
            errorSection.classList.remove("hidden");

        } finally {
            if (submitButton) {
                submitButton.disabled = false;
                submitButton.classList.remove("opacity-60");
                submitButton.classList.add("cursor-pointer");
            }
        }
    }

    function resetForm() {
        errorSection.classList.add("hidden");
        outputSection.classList.add("hidden");
        loadingSection.classList.add("hidden");
        loadingSection.classList.remove("flex");
        inputSection.classList.remove("hidden");

        responseEl.innerHTML = "";

        setTimeout(() => {
            inputSection.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 100);
    }
</script>
</body>
</html>
